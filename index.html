<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-mail confirmado | PixRewards</title>
<style>
  :root { box-sizing: border-box; }
  * { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0B0B0B;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #161616;
    border: 1px solid #D4AF37;
    border-radius: 18px;
    padding: 32px 24px;
    text-align: center;
  }
  .check {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 2px solid #D4AF37;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #D4AF37;
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #D4AF37; letter-spacing: 1px; }
  p { margin: 8px 0; color: #cfcfcf; line-height: 1.5; }
  .step {
    margin-top: 20px;
    padding: 14px;
    border-radius: 12px;
    background: rgba(212, 175, 55, 0.12);
    color: #F2D675;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="check">&#10003;</div>
    <h1>E-mail confirmado!</h1>
    <p>Seu e-mail foi vinculado à sua conta do PixRewards.</p>
    <div class="step">Volte ao app e toque em &ldquo;JÁ CONFIRMEI&rdquo; para continuar o seu saque.</div>
  </main>
</body>
</html>
